name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: I scanned a card in Bulk mode, and…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a binder
        2. Hold a card
        3. …
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About → Version.
      placeholder: 1.0.0
  - type: input
    id: phone
    attributes:
      label: Phone and system
      placeholder: Pixel 8, Android 16
  - type: textarea
    id: media
    attributes:
      label: Screenshots or a recording
      description: Drag files here. They help a lot.
